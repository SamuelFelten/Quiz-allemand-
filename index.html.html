<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allemand 1">
<meta name="theme-color" content="#0f0f13">
<title>Quiz Allemand 1</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --card: #22222f;
    --border: #2e2e42;
    --accent: #7c6af7;
    --accent2: #f7a26a;
    --green: #5bc98a;
    --red: #f76a6a;
    --text: #e8e8f0;
    --muted: #7a7a98;
    --serif: 'DM Serif Display', serif;
    --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    width: 100%;
    padding: 14px 20px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-family: var(--serif); font-size: 1.3rem; color: var(--text); letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); font-style: italic; }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 500;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover, .nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .view { display: none; width: 100%; max-width: 680px; padding: 24px 16px; }
  .view.active { display: block; }

  /* QUIZ */
  .filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .filter-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.79rem;
    font-weight: 500;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .progress-bar-wrap { background: var(--surface); border-radius: 4px; height: 5px; margin-bottom: 22px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.4s ease; }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px 24px;
    margin-bottom: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .q-label { font-size: 0.73rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .q-word { font-family: var(--serif); font-size: 2rem; color: var(--text); line-height: 1.25; margin-bottom: 8px; }
  .q-type-badge {
    display: inline-block;
    background: rgba(124,106,247,0.15);
    color: var(--accent);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .q-chapter { font-size: 0.73rem; color: var(--muted); }

  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .choice-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 14px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 0.88rem;
    font-weight: 400;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.35;
    -webkit-tap-highlight-color: transparent;
  }
  .choice-btn:active:not(:disabled) { transform: scale(0.97); }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(124,106,247,0.1); }
  .choice-btn.correct { background: rgba(91,201,138,0.15); border-color: var(--green); color: var(--green); }
  .choice-btn.wrong { background: rgba(247,106,106,0.15); border-color: var(--red); color: var(--red); }
  .choice-btn:disabled { cursor: default; }

  .feedback-row { text-align: center; font-size: 0.87rem; min-height: 26px; color: var(--muted); margin-bottom: 10px; }
  .feedback-row.correct-msg { color: var(--green); font-weight: 600; }
  .feedback-row.wrong-msg { color: var(--red); }

  .next-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 600;
    display: none;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .next-btn:hover { opacity: 0.87; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; flex: 1; text-align: center; }
  .stat-pill .val { font-size: 1.3rem; font-weight: 600; color: var(--text); }
  .stat-pill .lbl { font-size: 0.67rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

  /* LIST */
  .list-controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .list-filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 0.82rem;
    outline: none;
    cursor: pointer;
  }
  .word-count { color: var(--muted); font-size: 0.8rem; margin-bottom: 10px; }

  .table-wrap { max-height: 62vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
  .word-table { width: 100%; border-collapse: collapse; }
  .word-table th {
    text-align: left;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .word-table th:hover { color: var(--accent); }
  .sort-arrow { margin-left: 4px; opacity: 0.5; }
  .sort-arrow.active { opacity: 1; color: var(--accent); }
  .word-table td { padding: 9px 10px; font-size: 0.86rem; border-bottom: 1px solid rgba(46,46,66,0.5); vertical-align: top; }
  .word-table tr:hover td { background: rgba(124,106,247,0.05); }
  .german-cell { font-weight: 500; color: var(--text); }
  .french-cell { color: var(--muted); }
  .type-cell { font-size: 0.7rem; color: var(--accent); font-weight: 600; }
  .chap-cell { color: var(--muted); font-size: 0.76rem; text-align: center; }
  .mastery-cell { font-size: 0.76rem; white-space: nowrap; }
  .mastery-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .mastery-0 { background: var(--muted); }
  .mastery-1 { background: var(--accent2); }
  .mastery-2 { background: var(--green); }

  .install-banner {
    background: rgba(124,106,247,0.12);
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.82rem;
    color: var(--text);
    display: none;
  }
  .install-banner strong { color: var(--accent); }
  .install-close { float: right; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; }

  @media (max-width: 480px) {
    .choices-grid { grid-template-columns: 1fr; }
    .q-word { font-size: 1.6rem; }
    .word-table th:nth-child(4), .word-table td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Quiz <span>Allemand</span> 1</h1>
  <div class="nav-btns">
    <button class="nav-btn active" onclick="showView('quiz', this)">Quiz</button>
    <button class="nav-btn" onclick="showView('list', this)">Liste</button>
  </div>
</header>

<!-- QUIZ VIEW -->
<div class="view active" id="view-quiz">
  <div class="install-banner" id="install-banner">
    <span class="install-close" onclick="this.parentElement.style.display='none'">✕</span>
    <strong>💡 Installer sur iPad :</strong> appuie sur <strong>⎙ Partager</strong> dans Safari, puis <strong>« Sur l'écran d'accueil »</strong>. Ta progression sera sauvegardée !
  </div>

  <div class="filters" id="chapter-filters"></div>

  <div class="stats-row">
    <div class="stat-pill"><div class="val" id="stat-correct">0</div><div class="lbl">Corrects</div></div>
    <div class="stat-pill"><div class="val" id="stat-wrong">0</div><div class="lbl">Erreurs</div></div>
    <div class="stat-pill"><div class="val" id="stat-mastered">0</div><div class="lbl">Maîtrisés</div></div>
    <div class="stat-pill"><div class="val" id="stat-streak">0</div><div class="lbl">Série 🔥</div></div>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>

  <div class="question-card">
    <div class="q-label" id="q-label">Traduire en allemand</div>
    <div class="q-word" id="q-word">...</div>
    <div><span class="q-type-badge" id="q-type"></span> <span class="q-chapter" id="q-chapter"></span></div>
  </div>

  <div class="choices-grid" id="choices-grid"></div>
  <div class="feedback-row" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Question suivante →</button>
</div>

<!-- LIST VIEW -->
<div class="view" id="view-list">
  <div class="list-controls">
    <input class="search-input" type="text" placeholder="Rechercher..." id="list-search" oninput="renderList()">
    <select class="list-filter-select" id="list-chap" onchange="renderList()">
      <option value="all">Tous chapitres</option>
      <option value="1">Chapitre 1</option>
      <option value="2">Chapitre 2</option>
      <option value="3">Chapitre 3</option>
      <option value="4">Chapitre 4</option>
      <option value="5">Chapitre 5</option>
    </select>
    <select class="list-filter-select" id="list-type" onchange="renderList()">
      <option value="all">Tous types</option>
      <option value="S">Noms (S)</option>
      <option value="V">Verbes (V)</option>
      <option value="A">Adjectifs (A)</option>
      <option value="KW">Petits mots</option>
      <option value="Aus">Expressions</option>
    </select>
    <select class="list-filter-select" id="list-mastery" onchange="renderList()">
      <option value="all">Toute maîtrise</option>
      <option value="0">Nouveaux</option>
      <option value="1">Vus</option>
      <option value="2">Maîtrisés</option>
    </select>
  </div>
  <div class="word-count" id="list-count"></div>
  <div class="table-wrap">
    <table class="word-table">
      <thead>
        <tr>
          <th onclick="sortList('german')">Allemand <span class="sort-arrow" id="sort-german">↕</span></th>
          <th onclick="sortList('french')">Français <span class="sort-arrow" id="sort-french">↕</span></th>
          <th onclick="sortList('type')">Type <span class="sort-arrow" id="sort-type">↕</span></th>
          <th onclick="sortList('chapter')">Ch. <span class="sort-arrow" id="sort-chapter">↕</span></th>
          <th onclick="sortList('mastery')">Maîtrise <span class="sort-arrow" id="sort-mastery">↕</span></th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>
</div>

// ── PERSISTENCE ──
const SAVE_KEY = 'allemand1_mastery_v2';
const STATS_KEY = 'allemand1_stats_v2';

function saveProgress() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(mastery));
    localStorage.setItem(STATS_KEY, JSON.stringify({ correctTotal, wrongTotal, streak }));
  } catch(e) {}
}

function loadProgress() {
  try {
    const m = localStorage.getItem(SAVE_KEY);
    const s = localStorage.getItem(STATS_KEY);
    if (m) mastery = JSON.parse(m);
    if (s) {
      const st = JSON.parse(s);
      correctTotal = st.correctTotal || 0;
      wrongTotal = st.wrongTotal || 0;
      streak = st.streak || 0;
    }
  } catch(e) {}
}

// ── STATE ──
const TYPE_LABELS = { S:'Nom', V:'Verbe', A:'Adjectif', KW:'Petit mot', Aus:'Expression', nan:'', '':'', undefined:'' };
let mastery = {};
let correctTotal = 0, wrongTotal = 0, streak = 0;
let activeChapters = new Set([1,2,3,4,5]);
let currentQ = null;
let answered = false;
let sortCol = 'german';
let sortDir = 1; // 1 asc, -1 desc

// ── SPACED REPETITION ──
function getWeight(idx) {
  const m = mastery[idx] || 0;
  return m === 0 ? 10 : m === 1 ? 3 : 1;
}

function pickQuestion() {
  const pool = VOCAB.filter(w => activeChapters.has(w.chapter));
  if (!pool.length) return null;
  const total = pool.reduce((acc, w) => acc + getWeight(VOCAB.indexOf(w)), 0);
  let r = Math.random() * total;
  for (const w of pool) {
    r -= getWeight(VOCAB.indexOf(w));
    if (r <= 0) return { word: w, idx: VOCAB.indexOf(w) };
  }
  const last = pool[pool.length - 1];
  return { word: last, idx: VOCAB.indexOf(last) };
}

function getDistractors(correct, count = 3) {
  const pool = VOCAB.filter(w => w !== correct && activeChapters.has(w.chapter));
  return pool.sort(() => Math.random() - 0.5).slice(0, count);
}

function getDisplayGerman(word) {
  return word.german.split(';')[0].trim();
}

// ── QUIZ ──
function nextQuestion() {
  answered = false;
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback-row';

  const q = pickQuestion();
  if (!q) {
    document.getElementById('q-word').textContent = 'Sélectionne au moins un chapitre !';
    document.getElementById('choices-grid').innerHTML = '';
    return;
  }
  currentQ = q;
  const frToDe = Math.random() < 0.5;
  currentQ.frToDe = frToDe;

  document.getElementById('q-label').textContent = frToDe ? 'Traduire en allemand' : 'Traduire en français';
  document.getElementById('q-word').textContent = frToDe ? q.word.french : getDisplayGerman(q.word);
  document.getElementById('q-type').textContent = TYPE_LABELS[q.word.type] || q.word.type;
  document.getElementById('q-chapter').textContent = `Chapitre ${q.word.chapter}`;

  const distractors = getDistractors(q.word, 3);
  const options = [q.word, ...distractors].sort(() => Math.random() - 0.5);

  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  for (const opt of options) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = frToDe ? getDisplayGerman(opt) : opt.french;
    const correctAnswer = frToDe ? getDisplayGerman(q.word) : q.word.french;
    btn.onclick = () => handleAnswer(btn, opt === q.word, correctAnswer);
    grid.appendChild(btn);
  }

  updateStats();
}

function handleAnswer(btn, isCorrect, correctAnswer) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === correctAnswer) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    btn.classList.add('correct');
    correctTotal++;
    streak++;
    const prev = mastery[currentQ.idx] || 0;
    mastery[currentQ.idx] = Math.min(prev + 1, 2);
    fb.textContent = streak >= 3 ? `✓ Correct ! 🔥 Série de ${streak}` : '✓ Correct !';
    fb.className = 'feedback-row correct-msg';
  } else {
    btn.classList.add('wrong');
    wrongTotal++;
    streak = 0;
    mastery[currentQ.idx] = 0;
    fb.textContent = `✗ La bonne réponse était : ${correctAnswer}`;
    fb.className = 'feedback-row wrong-msg';
  }

  saveProgress();
  document.getElementById('next-btn').style.display = 'block';
  updateStats();
  updateProgress();
}

function updateStats() {
  document.getElementById('stat-correct').textContent = correctTotal;
  document.getElementById('stat-wrong').textContent = wrongTotal;
  document.getElementById('stat-streak').textContent = streak;
  const mastered = Object.values(mastery).filter(v => v === 2).length;
  document.getElementById('stat-mastered').textContent = mastered;
}

function updateProgress() {
  const pool = VOCAB.filter(w => activeChapters.has(w.chapter));
  const mastered = pool.filter(w => (mastery[VOCAB.indexOf(w)] || 0) === 2).length;
  const pct = pool.length ? (mastered / pool.length * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

// ── CHAPTER FILTERS ──
function buildFilters() {
  const wrap = document.getElementById('chapter-filters');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-chip on';
  allBtn.textContent = 'Tous';
  allBtn.dataset.ch = 'all';
  allBtn.onclick = () => toggleAll(allBtn);
  wrap.appendChild(allBtn);

  for (let c = 1; c <= 5; c++) {
    const btn = document.createElement('button');
    btn.className = 'filter-chip on';
    btn.textContent = `Chap. ${c}`;
    btn.dataset.ch = c;
    btn.onclick = () => toggleChapter(btn, c);
    wrap.appendChild(btn);
  }
}

function toggleAll(btn) {
  const chips = document.querySelectorAll('.filter-chip[data-ch]:not([data-ch="all"])');
  const allOn = activeChapters.size === 5;
  if (allOn) {
    activeChapters.clear();
    chips.forEach(b => b.classList.remove('on'));
    btn.classList.remove('on');
  } else {
    [1,2,3,4,5].forEach(c => activeChapters.add(c));
    chips.forEach(b => b.classList.add('on'));
    btn.classList.add('on');
  }
  updateProgress();
  nextQuestion();
}

function toggleChapter(btn, ch) {
  if (activeChapters.has(ch)) { activeChapters.delete(ch); btn.classList.remove('on'); }
  else { activeChapters.add(ch); btn.classList.add('on'); }
  document.querySelector('.filter-chip[data-ch="all"]').classList.toggle('on', activeChapters.size === 5);
  updateProgress();
  nextQuestion();
}

// ── LIST VIEW ──
const TYPE_ORDER = { S: 1, V: 2, A: 3, KW: 4, Aus: 5 };

function sortList(col) {
  if (sortCol === col) { sortDir *= -1; }
  else { sortCol = col; sortDir = 1; }
  // update arrows
  ['german','french','type','chapter','mastery'].forEach(c => {
    const el = document.getElementById('sort-' + c);
    if (!el) return;
    if (c === col) {
      el.textContent = sortDir === 1 ? '↑' : '↓';
      el.classList.add('active');
    } else {
      el.textContent = '↕';
      el.classList.remove('active');
    }
  });
  renderList();
}

function renderList() {
  const search = document.getElementById('list-search').value.toLowerCase();
  const chap = document.getElementById('list-chap').value;
  const type = document.getElementById('list-type').value;
  const masteryFilter = document.getElementById('list-mastery').value;

  let filtered = VOCAB.filter(w => {
    if (chap !== 'all' && w.chapter !== parseInt(chap)) return false;
    if (type !== 'all' && w.type !== type) return false;
    if (masteryFilter !== 'all' && (mastery[VOCAB.indexOf(w)] || 0) !== parseInt(masteryFilter)) return false;
    if (search) return w.german.toLowerCase().includes(search) || w.french.toLowerCase().includes(search);
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    let va, vb;
    if (sortCol === 'german') { va = getDisplayGerman(a).toLowerCase(); vb = getDisplayGerman(b).toLowerCase(); }
    else if (sortCol === 'french') { va = a.french.toLowerCase(); vb = b.french.toLowerCase(); }
    else if (sortCol === 'type') { va = TYPE_ORDER[a.type] || 99; vb = TYPE_ORDER[b.type] || 99; return sortDir * (va - vb); }
    else if (sortCol === 'chapter') { return sortDir * (a.chapter - b.chapter); }
    else if (sortCol === 'mastery') {
      va = mastery[VOCAB.indexOf(a)] || 0;
      vb = mastery[VOCAB.indexOf(b)] || 0;
      return sortDir * (va - vb);
    }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });

  const masteryLabels = ['Nouveau', 'Vu', 'Maîtrisé'];
  document.getElementById('list-count').textContent = `${filtered.length} mot${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('list-body');
  tbody.innerHTML = '';

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px">Aucun résultat</td></tr>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const w of filtered) {
    const idx = VOCAB.indexOf(w);
    const m = mastery[idx] || 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="german-cell">${getDisplayGerman(w)}</td>
      <td class="french-cell">${w.french}</td>
      <td class="type-cell">${w.type || ''}</td>
      <td class="chap-cell">${w.chapter}</td>
      <td class="mastery-cell"><span class="mastery-dot mastery-${m}"></span>${masteryLabels[m]}</td>
    `;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

// ── NAV ──
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'list') { sortList('german'); }
}

// ── INSTALL BANNER ──
function showInstallBannerIfNeeded() {
  const isIOS = /ipad|iphone|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const dismissed = localStorage.getItem('install_dismissed');
  if (isIOS && !isStandalone && !dismissed) {
    document.getElementById('install-banner').style.display = 'block';
    document.querySelector('.install-close').onclick = () => {
      document.getElementById('install-banner').style.display = 'none';
      localStorage.setItem('install_dismissed', '1');
    };
  }
}

// ── INIT ──
loadProgress();
buildFilters();
updateStats();
updateProgress();
nextQuestion();
showInstallBannerIfNeeded();
</script>
